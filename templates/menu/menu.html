<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Menu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --red: #ed2e2e;
      --text: #1a1a1a;
      --muted: #888;
      --line: #eee;
      --bg: #fff;
      --sat: env(safe-area-inset-top, 0px);
      --sar: env(safe-area-inset-right, 0px);
      --sab: env(safe-area-inset-bottom, 0px);
      --sal: env(safe-area-inset-left, 0px);
      --thumb: 48px;
      --tap: 44px;
    }

    * { box-sizing: border-box; }

    html {
      scroll-behavior: smooth;
      /* Sticky nav + notch: anchor jumps land below bar */
      scroll-padding-top: calc(var(--sat) + 52px);
    }

    body {
      font-family: "Roboto", system-ui, sans-serif;
      margin: 0;
      padding: 0 0 max(1.25rem, var(--sab));
      background: var(--bg);
      color: var(--text);
      /* 16px avoids iOS input zoom; base for mobile readability */
      font-size: 16px;
      line-height: 1.35;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: rgba(237, 46, 46, 0.12);
      touch-action: pan-y;
    }

    .wrap {
      width: 100%;
      margin: 0 auto;
      padding-left: max(12px, var(--sal));
      padding-right: max(12px, var(--sar));
    }

    @media (min-width: 540px) {
      .wrap {
        max-width: 520px;
        padding-left: max(16px, var(--sal));
        padding-right: max(16px, var(--sar));
      }
    }

    /* Sticky category strip */
    .top {
      position: sticky;
      top: 0;
      z-index: 20;
      background: var(--bg);
      border-bottom: 1px solid var(--line);
      padding-top: max(8px, var(--sat));
      padding-bottom: 6px;
    }

    .nav {
      display: flex;
      gap: 4px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scroll-snap-type: x proximity;
      scrollbar-width: none;
      overscroll-behavior-x: contain;
      margin: 0 -4px;
      padding: 4px 4px 2px;
    }
    .nav::-webkit-scrollbar { display: none; }

    .nav a {
      flex-shrink: 0;
      scroll-snap-align: start;
      font-size: 14px;
      font-weight: 500;
      color: var(--muted);
      text-decoration: none;
      min-height: var(--tap);
      display: inline-flex;
      align-items: center;
      padding: 8px 12px 10px;
      border-radius: 8px;
      border-bottom: 2px solid transparent;
    }

    .nav a:active {
      background: #f5f5f5;
    }

    .nav a.is-active {
      color: var(--text);
      border-bottom-color: var(--red);
      border-bottom-left-radius: 0;
      border-bottom-right-radius: 0;
    }

    .section {
      scroll-margin-top: calc(var(--sat) + 48px);
      margin-top: 1.25rem;
    }

    .section:first-of-type {
      margin-top: 0.75rem;
    }

    .label {
      margin: 0 0 6px;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .row-main {
      flex: 1;
      min-width: 0;
    }

    .name {
      font-weight: 500;
      font-size: 16px;
      line-height: 1.3;
    }

    .price {
      flex-shrink: 0;
      font-weight: 500;
      font-size: 16px;
      font-variant-numeric: tabular-nums;
      color: var(--red);
      padding: 4px 0;
    }

    .item-trigger {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      min-height: 56px;
      padding: 10px 0;
      margin: 0;
      border: none;
      border-bottom: 1px solid var(--line);
      background: none;
      cursor: pointer;
      text-align: left;
      font: inherit;
      color: inherit;
      touch-action: manipulation;
      -webkit-tap-highlight-color: rgba(237, 46, 46, 0.12);
    }

    .item-trigger:active {
      background: #fafafa;
    }

    .item-trigger:focus-visible {
      outline: 2px solid var(--red);
      outline-offset: 2px;
      border-radius: 6px;
    }

    .item-trigger img {
      width: var(--thumb);
      height: var(--thumb);
      object-fit: cover;
      border-radius: 8px;
      flex-shrink: 0;
    }

    .section > .item-trigger:last-child {
      border-bottom: none;
    }

    .chev {
      flex-shrink: 0;
      color: var(--muted);
      font-size: 1.25rem;
      font-weight: 300;
      line-height: 1;
    }

    dialog.item-dialog {
      width: 100%;
      max-width: 520px;
      padding: 0;
      border: none;
      border-radius: 16px 16px 0 0;
      margin: auto 0 0;
      max-height: min(88vh, 900px);
      box-shadow: 0 -8px 32px rgba(0, 0, 0, 0.15);
      background: var(--bg);
    }

    dialog.item-dialog::backdrop {
      background: rgba(0, 0, 0, 0.42);
    }

    .item-dialog-header {
      display: flex;
      justify-content: flex-end;
      padding: 8px 8px 0;
      position: sticky;
      top: 0;
      background: var(--bg);
      z-index: 1;
    }

    .item-dialog-close {
      width: 44px;
      height: 44px;
      border: none;
      background: transparent;
      font-size: 1.75rem;
      line-height: 1;
      color: var(--muted);
      cursor: pointer;
      border-radius: 8px;
    }

    .item-dialog-close:active {
      background: #f5f5f5;
    }

    .item-dialog-body {
      padding: 0 max(16px, var(--sar)) max(16px, var(--sab)) max(16px, var(--sal));
      overflow-y: auto;
      max-height: calc(88vh - 52px);
    }

    .item-dialog-body .item-title {
      margin: 0 0 10px;
      font-size: 1.35rem;
      font-weight: 500;
      line-height: 1.25;
    }

    .item-dialog-body .item-hero {
      width: 100%;
      max-height: 200px;
      object-fit: cover;
      border-radius: 12px;
      margin-bottom: 12px;
    }

    .item-dialog-body .item-price {
      margin: 0 0 12px;
      font-weight: 500;
      font-size: 1.1rem;
      color: var(--red);
      font-variant-numeric: tabular-nums;
    }

    .item-dialog-body .item-blurb {
      margin: 0 0 16px;
      font-size: 15px;
      line-height: 1.5;
      color: var(--muted);
    }

    .item-dialog-body .item-group {
      margin-bottom: 16px;
    }

    .item-dialog-body .item-group-title {
      margin: 0 0 8px;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .item-dialog-body .item-opts {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .item-dialog-body .item-opts li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      min-height: 44px;
      padding: 8px 0;
      font-size: 15px;
      border-bottom: 1px solid #f4f4f4;
    }

    .item-dialog-body .item-opts li:last-child {
      border-bottom: none;
    }

    .item-dialog-body .item-opt-p {
      font-variant-numeric: tabular-nums;
      color: var(--red);
      white-space: nowrap;
      font-size: 15px;
    }

    .item-dialog-body .item-opt-p.free {
      color: #2e7d32;
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
    }
  </style>
</head>
<body>
  <div class="top">
    <div class="wrap">
      <nav class="nav" aria-label="Categories">
        {% for cat in categories %}
        <a href="#cat-{{ cat.name|replace(' ','-') }}"{% if loop.first %} class="is-active"{% endif %}>{{ cat.name }}</a>
        {% endfor %}
      </nav>
    </div>
  </div>

  <div class="wrap">
    {% for cat in categories %}
    <section class="section" id="cat-{{ cat.name|replace(' ','-') }}">
      <p class="label">{{ cat.name }}</p>
      {% for i in cat['items'] %}
        <button
          type="button"
          class="item-trigger"
          data-item-id="{{ i.id }}"
          data-item-url="{{ url_for('item_detail', item_id=i.id, partial=1) }}"
          aria-haspopup="dialog"
          aria-controls="item-dialog">
          {% if i.image_path %}<img src="{{ i.image_path }}" alt="">{% endif %}
          <span class="row-main">
            <span class="name">{{ i.title }}</span>
          </span>
          <span class="price">
            {% if i.price_label %}{{ i.price_label }}{% else %}{{ "%.2f€"|format(i.price|float) }}{% endif %}
          </span>
          <span class="chev" aria-hidden="true">›</span>
        </button>
      {% endfor %}
    </section>
    {% endfor %}
  </div>

  <dialog id="item-dialog" class="item-dialog" aria-modal="true" aria-labelledby="item-sheet-title">
    <div class="item-dialog-header">
      <button type="button" class="item-dialog-close" aria-label="Close">&times;</button>
    </div>
    <div class="item-dialog-body"></div>
  </dialog>

  <script>
    (function () {
      var dlg = document.getElementById("item-dialog");
      var bodyEl = dlg && dlg.querySelector(".item-dialog-body");
      var closeBtn = dlg && dlg.querySelector(".item-dialog-close");
      if (dlg && bodyEl) {
        document.querySelectorAll(".item-trigger").forEach(function (btn) {
          btn.addEventListener("click", function () {
            var url = btn.getAttribute("data-item-url");
            if (!url) return;
            bodyEl.innerHTML = '<p style="color:#888;padding:1rem 0">Loading…</p>';
            dlg.showModal();
            fetch(url, { headers: { Accept: "text/html" } })
              .then(function (r) {
                if (!r.ok) throw new Error("load");
                return r.text();
              })
              .then(function (html) {
                bodyEl.innerHTML = html;
              })
              .catch(function () {
                bodyEl.innerHTML = '<p style="color:#888;padding:1rem 0">Could not load item.</p>';
              });
          });
        });
        if (closeBtn) {
          closeBtn.addEventListener("click", function () {
            dlg.close();
          });
        }
        dlg.addEventListener("click", function (e) {
          if (e.target === dlg) dlg.close();
        });
      }
    })();

    (function () {
      var sections = document.querySelectorAll(".section[id]");
      var links = document.querySelectorAll(".nav a");
      if (!sections.length || !links.length) return;
      var obs = new IntersectionObserver(
        function (entries) {
          entries.forEach(function (e) {
            if (!e.isIntersecting) return;
            var id = e.target.getAttribute("id");
            links.forEach(function (a) {
              a.classList.toggle("is-active", a.getAttribute("href") === "#" + id);
            });
          });
        },
        { rootMargin: "-38% 0px -52% 0px", threshold: 0 }
      );
      sections.forEach(function (s) {
        obs.observe(s);
      });
    })();
  </script>
</body>
</html>
